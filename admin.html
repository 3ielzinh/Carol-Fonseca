<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Painel | Carol Fonseca</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Manrope:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <section id="login-view" class="login-view">
    <form id="login-form">
      <span class="mark">CF</span>
      <p class="eyebrow">Acesso restrito</p>
      <h1>Painel</h1>
      <label for="password">Senha</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <p id="login-error" class="error" role="alert" hidden></p>
      <button type="submit">Entrar <span aria-hidden="true">→</span></button>
    </form>
  </section>

  <div id="panel-view" class="panel-view" hidden>
    <header class="admin-header">
      <a class="brand" href="/">
        <span class="brand-mark">CF</span>
        <span>Carol Fonseca<small>Painel</small></span>
      </a>
      <button id="logout-button" type="button">Sair</button>
    </header>

    <main>
      <div class="panel-head">
        <p class="eyebrow">Pré-checkout · pagamento</p>
        <h1>Pré-checkouts</h1>
        <p id="panel-status" class="meta"></p>
      </div>
      <p id="panel-error" class="error" role="alert" hidden></p>

      <div class="table-wrap">
        <table id="leads-table">
          <thead>
            <tr>
              <th>Nome</th>
              <th>WhatsApp</th>
              <th>E-mail</th>
              <th>Cargo</th>
              <th>Data</th>
              <th>Pagamento</th>
              <th class="col-action"></th>
            </tr>
          </thead>
          <tbody id="leads-body"></tbody>
        </table>
      </div>
      <p id="empty-state" class="empty" hidden>Nenhum pré-checkout registrado ainda.</p>

      <div class="pagination">
        <button id="prev-page" type="button" disabled>← Anterior</button>
        <span id="page-info" class="meta"></span>
        <button id="next-page" type="button" disabled>Próxima →</button>
      </div>
    </main>
  </div>

  <script src="admin.js"></script>
</body>
</html>
